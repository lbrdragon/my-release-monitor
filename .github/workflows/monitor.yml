name: Monitor Releases

on:
  schedule:
    - cron: '24 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Restore last versions
        uses: actions/cache/restore@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
          restore-keys: versions-

      - name: Check releases
        run: |
          REPOS="MohamadOday/iris-gallery Crustack/NotallyX"
          touch last_versions.txt
          for REPO in $REPOS; do
            echo "===== 检查 $REPO ====="

            TAG=$(curl -sSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.tag_name // empty')

            if [ -z "$TAG" ]; then
              echo "没有找到 Release，跳过。"
              continue
            fi

            LAST_TAG=$(grep "^$REPO:" last_versions.txt | cut -d: -f2)
            echo "最新版本: $TAG，上次记录: ${LAST_TAG:-无}"

            if [ "$TAG" != "$LAST_TAG" ]; then
              echo "发现新版本，发送通知..."
              curl -sS -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
                -d "title=🔔 $REPO 新版本: $TAG" \
                -d "desp=版本号: **$TAG**%0A%0A查看详情: https://github.com/$REPO/releases/latest"
              sed -i "/^$REPO:/d" last_versions.txt
              echo "$REPO:$TAG" >> last_versions.txt
            else
              echo "版本无变化，跳过通知。"
            fi
          done

      - name: Save versions
        if: always()
        uses: actions/cache/save@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
