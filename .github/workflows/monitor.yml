name: Monitor Iris Gallery Release

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check latest release and notify
        run: |
          RELEASE_JSON=$(curl -sSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MohamadOday/iris-gallery/releases/latest")

          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          if [ -z "$TAG" ]; then
            echo "没有找到 Release，跳过。"
            exit 0
          fi

          PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at')
          PUBLISHED_TS=$(date -d "$PUBLISHED_AT" +%s)
          NOW_TS=$(date +%s)
          DIFF_MIN=$(( (NOW_TS - PUBLISHED_TS) / 60 ))

          echo "最新版本: $TAG"
          echo "发布时间距今: $DIFF_MIN 分钟"

          if [ "$DIFF_MIN" -le 70 ]; then
            echo "发现新版本，发送通知..."
            curl -sS -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
              -d "title=🔔 Iris Gallery 新版本: $TAG" \
              -d "desp=版本号: **$TAG**%0A%0A查看详情: https://github.com/MohamadOday/iris-gallery/releases/latest"
          else
            echo "无新版本，跳过通知。"
          fi
