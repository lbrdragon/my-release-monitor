name: Monitor Releases

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Restore last versions
        uses: actions/cache/restore@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
          restore-keys: versions-

      - name: Check releases
        run: |
          REPOS="MohamadOday/iris-gallery Crustack/NotallyX copylee711/twinfile BlackyHawky/Clock"
          touch last_versions.txt
          UPDATES=""
          UPDATED_REPOS=""

          for REPO in $REPOS; do
            echo "===== 检查 $REPO ====="

            TAG=$(curl -sSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.tag_name // empty')

            if [ -z "$TAG" ]; then
              echo "没有找到 Release，跳过。"
              continue
            fi

            LAST_TAG=$(grep "^$REPO:" last_versions.txt | cut -d: -f2)
            echo "最新版本: $TAG，上次记录: ${LAST_TAG:-无}"

            if [ "$TAG" != "$LAST_TAG" ]; then
              echo "发现新版本，加入待通知列表。"
              printf -v LINE -- '- %s : %s\n  https://github.com/%s/releases/latest\n' "$REPO" "$TAG" "$REPO"
              UPDATES="${UPDATES}${LINE}"
              UPDATED_REPOS="${UPDATED_REPOS} $REPO:$TAG"
            else
              echo "版本无变化，跳过。"
            fi
          done

          if [ -z "$UPDATES" ]; then
            echo "所有项目版本均无变化，跳过通知。"
            exit 0
          fi

          SENT=0

          echo "===== 尝试 WxPusher（主力）====="
          WX_PAYLOAD=$(jq -n \
            --arg spt "${{ secrets.WXPUSHER_SPT }}" \
            --arg content "$UPDATES" \
            --arg summary "Release 更新通知" \
            '{spt:$spt, content:$content, summary:$summary, contentType:3}')

          WX_RESPONSE=$(curl -sS -X POST "https://wxpusher.zjiecode.com/api/send/message/simple-push" \
            -H "Content-Type: application/json" \
            -d "$WX_PAYLOAD" || echo '{"code":-1}')
          echo "$WX_RESPONSE"
          WX_CODE=$(echo "$WX_RESPONSE" | jq -r '.code // -1')

          if [ "$WX_CODE" -eq 1000 ]; then
            echo "WxPusher 发送成功。"
            SENT=1
          else
            echo "WxPusher 发送失败（code=$WX_CODE），切换 Server酱 备用通道..."

            SC_RESPONSE=$(curl -sS -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
              --data-urlencode "title=🔔 Release 更新通知" \
              --data-urlencode "desp=$UPDATES" || echo '{"code":-1}')
            echo "$SC_RESPONSE"
            SC_CODE=$(echo "$SC_RESPONSE" | jq -r '.code // -1')

            if [ "$SC_CODE" -eq 0 ]; then
              echo "Server酱 备用通道发送成功。"
              SENT=1
            else
              echo "Server酱 备用通道也失败（code=$SC_CODE）。"
            fi
          fi

          if [ "$SENT" -eq 1 ]; then
            for PAIR in $UPDATED_REPOS; do
              R="${PAIR%%:*}"; T="${PAIR#*:}"
              sed -i "\|^$R:|d" last_versions.txt
              echo "$R:$T" >> last_versions.txt
            done
            echo "通知已送达，已记录所有新版本。"
          else
            echo "所有通道均发送失败，本次不记录版本，下次运行会重试。"
            exit 1
          fi

      - name: Save versions
        if: always()
        uses: actions/cache/save@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
