name: Monitor Releases

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Restore last versions
        uses: actions/cache/restore@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
          restore-keys: versions-

      - name: Check releases
        run: |
          REPOS="MohamadOday/iris-gallery Crustack/NotallyX copylee711/twinfile BlackyHawky/Clock"
          touch last_versions.txt
          UPDATES=""
          UPDATED_REPOS=""

          for REPO in $REPOS; do
            echo "===== 检查 $REPO ====="

            TAG=$(curl -sSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.tag_name // empty')

            if [ -z "$TAG" ]; then
              echo "没有找到 Release，跳过。"
              continue
            fi

            # ===== 临时测试逻辑：强制 Clock 视为无记录 =====
            if [ "$REPO" = "BlackyHawky/Clock" ]; then
              LAST_TAG=""
            else
              LAST_TAG=$(grep "^$REPO:" last_versions.txt | cut -d: -f2)
            fi
            # ==============================================

            echo "最新版本: $TAG，上次记录: ${LAST_TAG:-无}"

            if [ "$TAG" != "$LAST_TAG" ]; then
              echo "发现新版本，加入待通知列表。"
              printf -v LINE -- '- %s : %s\n  https://github.com/%s/releases/latest\n' "$REPO" "$TAG" "$REPO"
              UPDATES="${UPDATES}${LINE}"
              UPDATED_REPOS="${UPDATED_REPOS} $REPO:$TAG"
            else
              echo "版本无变化，跳过。"
            fi
          done

          if [ -z "$UPDATES" ]; then
            echo "所有项目版本均无变化，跳过通知。"
            echo "HAS_UPDATES=false" >> $GITHUB_ENV
          else
            echo "HAS_UPDATES=true" >> $GITHUB_ENV
            {
              echo "UPDATES<<UPDATES_END"
              echo "$UPDATES"
              echo "UPDATES_END"
            } >> $GITHUB_ENV
            echo "UPDATED_REPOS=$UPDATED_REPOS" >> $GITHUB_ENV
          fi

      - name: Send Email (primary)
        id: email
        if: env.HAS_UPDATES == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.qq.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🔔 Release 更新通知
          to: ${{ secrets.MAIL_TO }}
          from: Release Monitor <${{ secrets.MAIL_USERNAME }}>
          body: |
            以下项目有新的 Release 版本：

            ${{ env.UPDATES }}

      - name: Send ServerChan (fallback)
        id: serverchan
        if: env.HAS_UPDATES == 'true' && steps.email.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "邮件发送失败，切换 Server酱 备用通道..."
          SC_RESPONSE=$(curl -sS -X POST "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_SENDKEY }}.send" \
            --data-urlencode "title=🔔 Release 更新通知" \
            --data-urlencode "desp=${{ env.UPDATES }}" || echo '{"code":-1}')
          echo "$SC_RESPONSE"
          SC_CODE=$(echo "$SC_RESPONSE" | jq -r '.code // -1')
          if [ "$SC_CODE" -eq 0 ]; then
            echo "Server酱 发送成功。"
          else
            echo "Server酱 也失败（code=$SC_CODE）。"
            exit 1
          fi

      - name: Record versions
        if: env.HAS_UPDATES == 'true' && (steps.email.outcome == 'success' || steps.serverchan.outcome == 'success')
        run: |
          for PAIR in ${{ env.UPDATED_REPOS }}; do
            R="${PAIR%%:*}"; T="${PAIR#*:}"
            sed -i "\|^$R:|d" last_versions.txt
            echo "$R:$T" >> last_versions.txt
          done
          echo "通知已送达，已记录所有新版本。"

      - name: Save versions
        if: always()
        uses: actions/cache/save@v5
        with:
          path: last_versions.txt
          key: versions-${{ github.run_id }}
